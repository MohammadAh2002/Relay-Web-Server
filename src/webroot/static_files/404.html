
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Relay Web Server</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0b1120;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .logo {
            margin-bottom: 75px;
            color: #f8fafc;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .logo span {
            color: #38bdf8;
        }

        .error-code {
            color: #38bdf8;
            font-size: clamp(100px, 20vw, 160px);
            font-weight: 900;
            letter-spacing: -10px;
            line-height: 1;
        }

        h1 {
            margin-top: 20px;
            color: #f8fafc;
            font-size: 30px;
        }

        .message {
            max-width: 420px;
            margin: 18px auto 35px;
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.8;
        }

        .request-info {
            display: inline-block;
            margin-bottom: 35px;
            padding: 12px 20px;
            border: 1px solid #263449;
            border-radius: 8px;
            background: #0f172a;
            color: #94a3b8;
            font-family: monospace;
            font-size: 13px;
        }

        .request-info span {
            color: #f87171;
        }

        .home-link {
            display: inline-block;
            padding: 12px 25px;
            border-radius: 7px;
            background: #0284c7;
            color: white;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }

        .home-link:hover {
            background: #0369a1;
        }

        footer {
            margin-top: 85px;
            padding-top: 25px;
            border-top: 1px solid #1e293b;
            color: #64748b;
            font-size: 13px;
        }

        footer a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="container">

        <div class="logo">RELAY<span>.</span></div>

        <div class="error-code">404</div>

        <h1>Oops! Page Not Found.</h1>

        <p class="message">
            The server is up, but the resource you're looking for
            doesn't exist or couldn't be found.
        </p>

        <div class="request-info">
            <span>HTTP/1.1 404 Not Found</span>
        </div>

        <br>

        <a href="/" class="home-link">Back to Home &rarr;</a>

        <footer>
            Built with Rust by
            <a href="https://mohammadah2002.github.io/My-Website/"
               target="_blank" rel="noopener noreferrer">
                Mohammad Ahmad
            </a>
        </footer>

    </main>
</body>
</html>
